 });
 h+='</tbody><tfoot><tr><td>Total</td><td>'+A.open+(A.open===1?' open day':' open days')+'</td><td>'+n(A.t.r)+'</td><td>'+n(A.t.g)+'</td><td>'+m(A.t.v)+'</td><td>'+m(A.t.d)+'</td></tr></tfoot></table></div>';
 return h;
}
function renderPeriod(kind){
 var r=range(kind),A=agg(r[0],r[1]),h='';PCTX=r[1];
 var lbl={n7:'Next 7 Days',n30:'Next 30 Days',wtd:'Week to Date',mtd:'Month to Date'}[kind];
 h+='<div class="head"><h2>'+lbl+'</h2><div class="sub" style="margin:0">'+esc(midD(r[0]))+' &ndash; '+esc(midD(r[1]))+'</div></div>';
 h+='<div class="sec">Totals</div><div class="grid g5">'+tile('Reservations',n(A.t.r))+tile('Guests',n(A.t.g))+tile('Revenue',m(A.t.v),null,'blue')+tile('Deposited',m(A.t.d),Math.round((A.t.d/(A.t.v||1))*100)+'% of revenue','green')+tile('Avg / Res',A.t.r?m(A.t.v/A.t.r):'&mdash;')+'</div>';
 h+='<div class="sec">Revenue by Source</div><div class="grid g2">'+srcCard('In House / Digital',A.i,A.t,'blue')+srcCard('Host / Promoter',A.h,A.t,'red')+'</div>';
 h+='<div class="sec">Product Breakdown</div>'+prodTable(A);
 h+='<div class="sec">Daily Detail</div>'+dayTable(A);
 return h;
}
function render(){
 document.getElementById('tabs').innerHTML=TABS.map(function(t){return '<button class="tab'+(STATE.view===t[0]?' on':'')+'" data-v="'+t[0]+'">'+t[1]+'</button>';}).join('');
 Array.prototype.forEach.call(document.querySelectorAll('#tabs .tab'),function(b){b.addEventListener('click',function(){STATE.view=b.getAttribute('data-v');render();window.scrollTo(0,0);});});
 document.getElementById('view').innerHTML=(STATE.view==='day'?renderDay():renderPeriod(STATE.view))+'<div class="note">Source: UrVenue booking details for Tailgate Beach Club. Host / Promoter = bookings created by James Scott, Jose Gonzalez or Bryce Olson; all other bookings are In House / Digital. Bookings with no product type are included in totals but not in the product breakdown. Dates with no bookings are shown as Closed. Days running more than one ecozone are broken out separately below the whole-day figures; ecozone sub-totals sum to the day total. Thursdays are always reported as a single combined day.</div>';
 var ds=document.getElementById('daysel');
 if(ds)ds.addEventListener('change',function(){STATE.date=ds.value;render();});
}
function stamp(){
 var gap=Math.round((mkD(TODAY)-mkD(DATA_AS_OF))/86400000);
 var s='Data through '+longD(DATA_AS_OF)+'  \u2022  last updated '+GEN;
 if(gap>0)s+='  \u2022  <span style="color:#ED6154;font-weight:600">snapshot is '+gap+' day'+(gap===1?'':'s')+' old</span>';
 document.getElementById('stamp').innerHTML=s;
}
stamp();
render();
</script>
</body>
</html>
