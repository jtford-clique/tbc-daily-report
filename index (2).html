 h+='<div class="evs">'+(d.e.length?d.e.map(esc).join(' &nbsp;&bull;&nbsp; '):'No event listed')+'</div>';
 h+='<div class="sec">Totals</div><div class="grid g4">'+tile('Reservations',n(d.t.r))+tile('Guests',n(d.t.g))+tile('Revenue',m(d.t.v),null,'blue')+tile('Deposited',m(d.t.d),Math.round((d.t.d/(d.t.v||1))*100)+'% of revenue','green')+'</div>';
 h+='<div class="sec">Revenue by Source</div><div class="grid g2">'+srcCard('In House / Digital',d.i,d.t,'blue')+srcCard('Host / Promoter',d.h,d.t,'red')+'</div>';
 h+='<div class="sec">Product Breakdown</div><div class="grid g3">';
 PK.forEach(function(k){var p=d.p[k]||seg();
  var sub=n(p.g)+' guests &nbsp;&bull;&nbsp; '+m(p.v);
  if(k==='cab'&&p.f)sub+='<br>'+n(p.f)+' @ $500 min';
  h+=tile(PLBL[k],n(p.r)+'<span style="font-size:13px;color:#8fb4cc;font-weight:600"> bkgs</span>',sub);});
 h+='</div>';
 return h;
}
function prodTable(A){
 var h='<div class="tw"><table><thead><tr><th>Product</th><th>Bookings</th><th>Guests</th><th>Revenue</th><th>Deposited</th><th>Avg / Bkg</th></tr></thead><tbody>';
 PK.forEach(function(k){var p=A.p[k];
  h+='<tr><td>'+PROW[k]+(k==='cab'&&p.f?' <span style="color:#8fb4cc;font-size:11px">('+n(p.f)+' @ $500 min)</span>':'')+'</td><td>'+n(p.r)+'</td><td>'+n(p.g)+'</td><td>'+m(p.v)+'</td><td>'+m(p.d)+'</td><td>'+(p.r?m(p.v/p.r):'&mdash;')+'</td></tr>';});
 h+='</tbody></table></div>';
 return h;
}
function dayTable(A){
 var h='<div class="tw"><table><thead><tr><th>Date</th><th>Event</th><th>Res</th><th>Guests</th><th>Revenue</th><th>Deposited</th></tr></thead><tbody>';
 A.dates.forEach(function(x){
  var cls=(x.date===TODAY?' istoday':'');
  var lab=esc(shortD(x.date))+(x.date===TODAY?' <span style="color:#61A8C2;font-size:10px;letter-spacing:.1em">TODAY</span>':'');
  if(!x.d){h+='<tr class="closed'+cls+'"><td>'+lab+'</td><td colspan="5">Closed</td></tr>';return;}
  h+='<tr class="'+cls.trim()+'"><td>'+lab+'</td><td class="ev">'+(x.d.e.length?esc(x.d.e[0]):'&mdash;')+'</td><td>'+n(x.d.t.r)+'</td><td>'+n(x.d.t.g)+'</td><td>'+m(x.d.t.v)+'</td><td>'+m(x.d.t.d)+'</td></tr>';});
 h+='</tbody><tfoot><tr><td>Total</td><td>'+A.open+(A.open===1?' open day':' open days')+'</td><td>'+n(A.t.r)+'</td><td>'+n(A.t.g)+'</td><td>'+m(A.t.v)+'</td><td>'+m(A.t.d)+'</td></tr></tfoot></table></div>';
 return h;
}
function renderPeriod(kind){
 var r=range(kind),A=agg(r[0],r[1]),h='';
 var lbl={n7:'Next 7 Days',n30:'Next 30 Days',wtd:'Week to Date',mtd:'Month to Date'}[kind];
 h+='<div class="head"><h2>'+lbl+'</h2><div class="sub" style="margin:0">'+esc(midD(r[0]))+' &ndash; '+esc(midD(r[1]))+'</div></div>';
 h+='<div class="sec">Totals</div><div class="grid g5">'+tile('Reservations',n(A.t.r))+tile('Guests',n(A.t.g))+tile('Revenue',m(A.t.v),null,'blue')+tile('Deposited',m(A.t.d),Math.round((A.t.d/(A.t.v||1))*100)+'% of revenue','green')+tile('Avg / Res',A.t.r?m(A.t.v/A.t.r):'&mdash;')+'</div>';
 h+='<div class="sec">Revenue by Source</div><div class="grid g2">'+srcCard('In House / Digital',A.i,A.t,'blue')+srcCard('Host / Promoter',A.h,A.t,'red')+'</div>';
 h+='<div class="sec">Product Breakdown</div>'+prodTable(A);
 h+='<div class="sec">Daily Detail</div>'+dayTable(A);
 return h;
}
function render(){
 document.getElementById('tabs').innerHTML=TABS.map(function(t){return '<button class="tab'+(STATE.view===t[0]?' on':'')+'" data-v="'+t[0]+'">'+t[1]+'</button>';}).join('');
 Array.prototype.forEach.call(document.querySelectorAll('#tabs .tab'),function(b){b.addEventListener('click',function(){STATE.view=b.getAttribute('data-v');render();window.scrollTo(0,0);});});
 document.getElementById('view').innerHTML=(STATE.view==='day'?renderDay():renderPeriod(STATE.view))+'<div class="note">Source: UrVenue booking details for Tailgate Beach Club. Host / Promoter = bookings created by James Scott, Jose Gonzalez or Bryce Olson; all other bookings are In House / Digital. Bookings with no product type are included in totals but not in the product breakdown. Dates with no bookings are shown as Closed.</div>';
 var ds=document.getElementById('daysel');
 if(ds)ds.addEventListener('change',function(){STATE.date=ds.value;render();});
}
function stamp(){
 var gap=Math.round((mkD(TODAY)-mkD(DATA_AS_OF))/86400000);
 var s='Data through '+longD(DATA_AS_OF)+'  \u2022  last updated '+GEN;
 if(gap>0)s+='  \u2022  <span style="color:#ED6154;font-weight:600">snapshot is '+gap+' day'+(gap===1?'':'s')+' old</span>';
 document.getElementById('stamp').innerHTML=s;
}
stamp();
render();
</script>
</body>
</html>
